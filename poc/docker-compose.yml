# AI Work Assistant POC sandbox (plan section 3.1).
#
#   npm --prefix poc run up       # seed if needed, build, start, wait for health
#   npm --prefix poc run reset    # stop, fresh seed, start
#   npm --prefix poc run down     # stop
#   sh poc/scripts/check-isolation.sh   # on the laptop, after `up`
#
# Every service sits on `sandbox` (internal: no route out). Only `gateway`
# also sits on `edge`; its 8443 listener forwards to api.anthropic.com and
# nothing else. Host ports bind to 127.0.0.1 only. All data lives in
# poc/data (gitignored). The API key comes from poc/.env (gitignored) and only
# the brain receives it.

name: planr-poc

networks:
  sandbox:
    internal: true
  edge: {}

x-node-service: &node-service
  build:
    context: ..
    dockerfile: poc/Dockerfile.node
  image: planr-poc-node:dev
  restart: unless-stopped
  networks: [sandbox]

x-common-env: &common-env
  POC_DATA_DIR: /data
  POC_TZ: ${POC_TZ:-UTC}
  TZ: ${POC_TZ:-UTC}
  POC_NOW: ${POC_NOW:-}

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  gateway:
    build:
      context: ..
      dockerfile: poc/Dockerfile.gateway
    image: planr-poc-gateway:dev
    restart: unless-stopped
    networks: [sandbox, edge]
    ports:
      - "127.0.0.1:5180:5180"   # sidebar + /api -> brain
      - "127.0.0.1:5181:5181"   # Planr test copy -> pm:8080
      - "127.0.0.1:5182:5182"   # mocks control page -> mocks:8090
    depends_on:
      brain: { condition: service_healthy }
      pm: { condition: service_healthy }
      mocks: { condition: service_healthy }

  pm:
    <<: *node-service
    command: ["node", "--import", "tsx", "packages/pm-server/src/main.ts"]
    environment:
      <<: *common-env
    volumes:
      - ./data/pm:/data/pm
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  mocks:
    <<: *node-service
    command: ["node", "--import", "tsx", "packages/mocks/src/server.ts"]
    environment:
      <<: *common-env
    volumes:
      - ./data:/data:ro
      - ./data/mocks:/data/mocks
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/_control/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  brain:
    <<: *node-service
    command: ["node", "--import", "tsx", "packages/brain/src/main.ts"]
    env_file:
      - path: .env               # ANTHROPIC_API_KEY lives here (gitignored)
        required: false
    environment:
      <<: *common-env
      # The brain reads ONLY this for its Claude endpoint (never ANTHROPIC_BASE_URL).
      POC_CLAUDE_BASE_URL: http://gateway:8443
      PM_MCP_URL: http://pm:8081/mcp
      MOCKS_URL: http://mocks:8090
      SPEECH_URL: http://speech:7100
      POC_MAX_USD_PER_DAY: ${POC_MAX_USD_PER_DAY:-5}
    volumes:
      - ./data:/data:ro           # files/ and seed-info.json, read only
      - ./data/brain:/data/brain
      - ./data/profiles:/data/profiles
      - ./data/logs:/data/logs
    depends_on:
      pm: { condition: service_healthy }
      mocks: { condition: service_healthy }
      speech: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  speech:
    build:
      context: ..
      dockerfile: poc/Dockerfile.speech
    image: planr-poc-speech:dev
    restart: unless-stopped
    networks: [sandbox]
    environment:
      TZ: ${POC_TZ:-UTC}
