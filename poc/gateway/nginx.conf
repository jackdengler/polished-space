# Gateway: the only container on the `edge` network (the only way out).
#
# Inbound (host ports, bound to 127.0.0.1 by compose):
#   5180 -> sidebar static build, plus /api -> brain:7000 (SSE + WebSocket)
#   5181 -> pm:8080     (Planr test copy + storage API)
#   5182 -> mocks:8090  (control page + fake Graph / Zoom)
# Outbound (sandbox network only, not published to the host):
#   8443 -> https://api.anthropic.com and nothing else. The brain sets
#           ANTHROPIC_BASE_URL=http://gateway:8443. Streaming passes through
#           unbuffered. The API key travels in the request header from the
#           brain; it is never logged (no headers in the log format).
#
# Upstreams are set through variables so nginx starts even when a service is
# not up yet, and resolves names through Docker's DNS at request time.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  client_max_body_size 25m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format poc '$time_iso8601 port=$server_port "$request" $status upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout poc;
  error_log  /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- 5180: sidebar + brain API ------------------------------------------
  server {
    listen 5180;
    root /usr/share/nginx/html;

    location /api/ {
      set $brain http://brain:7000;
      proxy_pass $brain;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;            # SSE events and streamed chat
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # ---- 5181: Planr test copy ----------------------------------------------
  server {
    listen 5181;
    location / {
      set $pm http://pm:8080;
      proxy_pass $pm;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;            # /api/events is SSE
      proxy_read_timeout 3600s;
    }
  }

  # ---- 5182: mocks control page and fake APIs ------------------------------
  server {
    listen 5182;
    location / {
      set $mocks http://mocks:8090;
      proxy_pass $mocks;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  # ---- 8443: outbound to Claude only ---------------------------------------
  server {
    listen 8443;

    location / {
      set $claude https://api.anthropic.com;
      proxy_pass $claude;
      proxy_http_version 1.1;
      proxy_set_header Host api.anthropic.com;
      proxy_set_header Connection "";

      proxy_ssl_server_name on;
      proxy_ssl_name api.anthropic.com;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_buffering off;            # stream tokens as they arrive
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
